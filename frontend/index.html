<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNIF Runbook Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 16px 24px; background: #1a1d27; border-bottom: 1px solid #2d3148; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; font-weight: 600; color: #7c8cff; }
    header span { font-size: 12px; color: #64748b; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .msg.user { background: #2d3148; align-self: flex-end; color: #e2e8f0; }
    .msg.bot { background: #1a1d27; border: 1px solid #2d3148; align-self: flex-start; color: #cbd5e1; }
    .msg.bot .latency { font-size: 11px; color: #475569; margin-top: 6px; }
    .msg.typing { color: #64748b; font-style: italic; }
    #input-area { padding: 16px 24px; background: #1a1d27; border-top: 1px solid #2d3148; display: flex; gap: 12px; }
    #question { flex: 1; background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 12px 16px; color: #e2e8f0; font-size: 14px; outline: none; resize: none; }
    #question:focus { border-color: #7c8cff; }
    #send { background: #7c8cff; color: white; border: none; border-radius: 8px; padding: 12px 20px; cursor: pointer; font-size: 14px; font-weight: 500; }
    #send:hover { background: #6366f1; }
    #send:disabled { background: #2d3148; cursor: not-allowed; }
    #clear { background: transparent; color: #64748b; border: 1px solid #2d3148; border-radius: 8px; padding: 12px 16px; cursor: pointer; font-size: 13px; }
    #clear:hover { color: #e2e8f0; border-color: #475569; }
  </style>
</head>
<body>
  <header>
    <h1>🛠 DNIF Runbook Assistant</h1>
    <span id="session-label">Starting session...</span>
  </header>
  <div id="messages">
    <div class="msg bot">Hi! I'm your DNIF platform assistant. Ask me anything about incident runbooks, high CPU alerts, disk issues, or past post-mortems.</div>
  </div>
  <div id="input-area">
    <textarea id="question" rows="2" placeholder="Ask about an incident, runbook, or platform issue..."></textarea>
    <button id="clear" onclick="clearChat()">Clear</button>
    <button id="send" onclick="sendMessage()">Send</button>
  </div>

  <script>
    let sessionId = "";

    document.getElementById("question").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const input = document.getElementById("question");
      const question = input.value.trim();
      if (!question) return;

      input.value = "";
      document.getElementById("send").disabled = true;

      appendMessage("user", question);
      const typing = appendMessage("bot typing", "Thinking...");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, session_id: sessionId })
        });
        const data = await res.json();
        sessionId = data.session_id;
        document.getElementById("session-label").textContent = `Session: ${sessionId.slice(0, 8)}`;
        typing.remove();
        appendMessage("bot", data.answer, data.latency_ms);
      } catch (err) {
        typing.remove();
        appendMessage("bot", "Error: could not reach the server.");
      }

      document.getElementById("send").disabled = false;
      input.focus();
    }

    async function clearChat() {
      if (!sessionId) return;
      await fetch("/clear", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId })
      });
      sessionId = "";
      document.getElementById("messages").innerHTML =
        '<div class="msg bot">Chat cleared. Start a new conversation!</div>';
      document.getElementById("session-label").textContent = "New session";
    }

    function appendMessage(type, text, latency) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      div.textContent = text;
      if (latency) {
        const s = document.createElement("div");
        s.className = "latency";
        s.textContent = `${latency}ms`;
        div.appendChild(s);
      }
      document.getElementById("messages").appendChild(div);
      div.scrollIntoView({ behavior: "smooth" });
      return div;
    }
  </script>
</body>
</html>
